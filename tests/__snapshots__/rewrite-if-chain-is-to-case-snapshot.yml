id: rewrite-if-chain-is-to-case
snapshots:
  ? |
    if identifier_here is value_here:
        # First branch comment.
        do_x()
        do_x2()
    elif identifier_here is other_value:
        # Second branch comment.
        do_y()
    elif identifier_here is third_value:
        do_y2()
    else:
        do_z()
