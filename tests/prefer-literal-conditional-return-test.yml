id: prefer-literal-conditional-return
valid:
  - |
    return 1 if (args.enabled and files) else 0
  - |
    if args.enabled and files:
      print("needs multiple statements")
      return 1

    return 0
  - |
    if args.enabled and files:
      return some_value

    return 0
  - |
    if args.enabled and files:
      return 1, files

    return 0, []
  - |
    if value:
      return make_value()

    return []
invalid:
  - |
    if args.enabled and files:
      return 1

    return 0
  - |
    if value:
      return "present"

    return "missing"
  - |
    if value:
      return True

    return False
  - |
    if value:
      return None

    return ...
  - |
    if value := get_value():
      return 1.5

    return 0.0
  - |
    if value:
      return []

    return {}
  - |
    if value:
      return (1, 2)

    return ()
