id: missing-init-return-type
valid:
  - |
    class C:
        def __init__(self) -> None:
            pass
  - |
    class C:
        def __init__(self, x: int) -> None:
            pass
  - |
    class C:
        def other(self):
            pass
  - |
    def __init__(self) -> object:
        pass
invalid:
  - |
    class C:
        def __init__(self):
            pass
  - |
    class C:
        def __init__(self, name: str):
            self.name = name
