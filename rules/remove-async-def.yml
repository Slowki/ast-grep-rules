id: remove-async-def
language: python
severity: warning
rule:
  pattern:
    context: "async def $FUNC($$$ARGS): $$$BODY"
    selector: function_definition
rewriters:
  - id: remove-await-call
    rule:
      pattern: "await $$$CALL"
    fix: $$$CALL
transform:
  REMOVED_BODY:
    rewrite:
      rewriters: [remove-await-call]
      source: $$$BODY
fix: |-
  def $FUNC($$$ARGS):
    $REMOVED_BODY
