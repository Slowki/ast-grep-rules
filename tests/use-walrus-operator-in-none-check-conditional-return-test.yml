id: use-walrus-operator-in-none-check-conditional-return
valid:
  - |
    return int(value) if (value := getattr(instance, "id", None)) is not None else None
  # This is valid because the assignment is not adjacent to the return.
  - |
    value = getattr(instance, "id", None)
    print(value)
    return int(value) if value is not None else None
  # This is valid because value is being used to shorten the condition, but is never itself used.
  - |
    value = getattr(instance, "id", None)
    return 1 if value is not None else None
invalid:
  - |
    value = getattr(instance, "id", None)
    return int(value) if value is not None else None
  - |
    value = getattr(instance, "id", None)
    return value if value is not None else None
